<!doctype html>
<!--
  Study Live — digital study planner
  Discovery: deliverable = mobile-first student app (390px authoring, responsive to desktop)
  direction = warm university paper & stationery; ar (RTL) + ru + en; light/dark
  storage = localStorage (offline-first, no build step, no runtime network)
-->
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Study Live</title>
    <meta name="description" content="Study Live — منصتك الرقمية لتنظيم مهامك الدراسية وملاحظاتك وفصولك. تطبيق PWA سريع، يعمل بدون إنترنت ويضمن خصوصية بياناتك." />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' https://unpkg.com https://api-maps.yandex.ru https://yastatic.net; style-src 'self' 'unsafe-inline' https://unpkg.com https://api-maps.yandex.ru https://yastatic.net; img-src 'self' data: blob: https:; font-src 'self'; connect-src 'self' https:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'"
    />
    
    <!-- Open Graph / Social Media -->
    <meta property="og:title" content="Study Live — Digital Study Planner" />
    <meta property="og:description" content="نظّم حياتك الدراسية بسهولة، مهامك اليومية، موادك، وكلمات سرك في مكان واحد" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://studylive.app" />
    
    <meta name="theme-color" content="#f7f2e9" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/assets/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/assets/icon-180.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    
    <!-- Leaflet (Maps) -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  </head>
  <body>
    <div class="app">
      <header class="header">
        <span class="brand">
          <span class="brand-crest">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4.5" y="3" width="15" height="18" rx="3"/><path d="M8.5 3v18"/><path d="M13.5 3v5.5l1.8-1.4 1.8 1.4V3"/></svg>
          </span>
          <span class="brand-titles">
            <span class="name">Study Live</span>
            <span class="brand-tag" data-host="brandtag">منصة الطالب</span>
          </span>
        </span>
        <nav class="desktop-nav" aria-label="Desktop Navigation" data-host="desktopnav">
          <button type="button" class="desktop-nav-link is-active" data-dpage="overview">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9.5L12 3l9 6.5V20a1.5 1.5 0 0 1-1.5 1.5h-15A1.5 1.5 0 0 1 3 20z"/><path d="M9 21.5V12h6v9.5"/></svg>
            <span>الرئيسية</span>
          </button>
          <button type="button" class="desktop-nav-link" data-dpage="tasks">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3.5" y="5" width="17" height="16" rx="3"/><path d="M3.5 9.5h17"/><path d="M8 3v4"/><path d="M16 3v4"/><path d="M9 14.8l2 2 3.8-3.8"/></svg>
            <span>المهام</span>
          </button>
          <button type="button" class="desktop-nav-link" data-dpage="notes">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v8.5L14.5 19H7a2 2 0 0 1-2-2z"/><path d="M19 13.5h-4.5V19"/><path d="M8.5 9h7"/><path d="M8.5 12.5h4"/></svg>
            <span>الملاحظات</span>
          </button>
          <button type="button" class="desktop-nav-link" data-dpage="stats">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 20V10"/><path d="M9 20V6"/><path d="M14 20V12"/><path d="M19 20V4"/></svg>
            <span>الإحصائيات</span>
          </button>
          <button type="button" class="desktop-nav-link" data-dpage="vault">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="5" y="10.5" width="14" height="10" rx="2.5"/><path d="M8 10.5V7a4 4 0 0 1 8 0v3.5"/></svg>
            <span>الحسابات</span>
          </button>
          <button type="button" class="desktop-nav-link" data-dpage="places">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>
            <span>المواقع</span>
          </button>
          <button type="button" class="desktop-nav-link" data-dpage="profile">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="3.6"/><path d="M5 20c1.2-3.4 3.9-5 7-5s5.8 1.6 7 5"/></svg>
            <span>ملفي</span>
          </button>
        </nav>
        <div class="header-actions">
          <button class="icon-btn pill-btn" data-act="lang" aria-haspopup="menu">
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="8.5"/><path d="M3.5 12h17"/><path d="M12 3.5c2.5 2.3 3.8 5 3.8 8.5s-1.3 6.2-3.8 8.5c-2.5-2.3-3.8-5-3.8-8.5s1.3-6.2 3.8-8.5z"/></svg>
            <span class="icon-label" data-host="langname">AR</span>
          </button>
          <button class="icon-btn pill-btn" data-act="theme" aria-label="Theme" data-host="themebtn">
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 13.5A8 8 0 0 1 10.5 4 7.2 7.2 0 1 0 20 13.5z"/></svg>
          </button>
          <div class="lang-menu" role="menu" data-host="langmenu"></div>
        </div>
      </header>
      <main class="main"></main>
      <button class="fab" hidden aria-label=""></button>
      <nav class="bottom-nav" aria-label="Study Live"></nav>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
